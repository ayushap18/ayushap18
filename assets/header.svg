<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Ayush Sharma: I build AI agents, native apps and terminals">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".07"/>
    </pattern>
    <radialGradient id="glow" cx="88%" cy="0%" r="75%">
      <stop offset="0" stop-color="#C6FF3D" stop-opacity=".2"/>
      <stop offset="1" stop-color="#C6FF3D" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="420" rx="24"/></clipPath>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
    .label{font-size:14px;letter-spacing:.18em;fill:#8A8A86}
    .h{font-size:68px;font-weight:700;letter-spacing:-.035em;fill:#F4F4F0}
    .acc{fill:#C6FF3D}
    .blink{animation:b 1.1s steps(1) infinite}
    @keyframes b{50%{fill-opacity:0}}
    .flow{stroke-dasharray:6 8;animation:f 1.2s linear infinite}
    @keyframes f{to{stroke-dashoffset:-28}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="#0B0B0C"/>
    <rect width="1200" height="420" fill="url(#dots)"/>
    <rect width="1200" height="420" fill="url(#glow)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="419" rx="23.5" fill="none" stroke="#fff" stroke-opacity=".08"/>

  <!-- top row -->
  <text x="56" y="68" class="mono label">AYUSH SHARMA  /  NEW DELHI, IN</text>
  <g>
    <rect x="860" y="44" width="284" height="36" rx="18" fill="#C6FF3D" fill-opacity=".06" stroke="#C6FF3D" stroke-opacity=".35"/>
    <circle cx="884" cy="62" r="5" fill="#C6FF3D">
      <animate attributeName="r" values="5;12" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values=".5;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="884" cy="62" r="4.5" fill="#C6FF3D"/>
    <text x="900" y="67" class="mono acc" font-size="13" letter-spacing=".14em">AVAILABLE FOR FREELANCE</text>
  </g>

  <!-- headline -->
  <text x="52" y="198" class="sans h">I build AI agents,</text>
  <text x="52" y="276" class="sans h">native apps <tspan class="acc">&amp; terminals.</tspan></text>

  <!-- agent graph: router fans out to three agents, merges -->
  <g stroke-width="1.5" fill="none">
    <path d="M980 210 L1050 150 L1120 210 M980 210 L1050 270 L1120 210" stroke="#fff" stroke-opacity=".16"/>
    <path d="M980 210 L1050 210 L1120 210" stroke="#C6FF3D" stroke-opacity=".9" class="flow"/>
    <g fill="#0B0B0C" stroke="#fff" stroke-opacity=".35">
      <circle cx="980" cy="210" r="7"/>
      <circle cx="1050" cy="150" r="6"/>
      <circle cx="1050" cy="270" r="6"/>
    </g>
    <circle cx="1050" cy="210" r="6" fill="#0B0B0C" stroke="#C6FF3D"/>
    <circle cx="1120" cy="210" r="8" fill="#C6FF3D"/>
  </g>

  <!-- bottom row -->
  <line x1="56" y1="318" x2="1144" y2="318" stroke="#fff" stroke-opacity=".08"/>
  <text x="56" y="364" class="mono" font-size="14" fill="#B8B8B2"><tspan class="acc">~/ayushap18 $</tspan> now shipping tachyon, tracegraph, pencyl <tspan class="acc blink">█</tspan></text>
  <text x="1144" y="364" text-anchor="end" class="mono label">RUST · TYPESCRIPT · PYTHON · SWIFT</text>
</svg>
