<svg xmlns="http://www.w3.org/2000/svg" width="600" height="372" viewBox="0 0 600 372" role="img" aria-label="RagGPT: Self-correcting RAG over your PDFs that grades retrieval and verifies citations.">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".06"/></pattern>
  <radialGradient id="glow" cx="88%" cy="0%" r="75%"><stop offset="0" stop-color="#C6FF3D" stop-opacity=".14"/><stop offset="1" stop-color="#C6FF3D" stop-opacity="0"/></radialGradient>
  <clipPath id="card"><rect width="600" height="372" rx="20"/></clipPath>
</defs>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
  .label{font-size:13px;letter-spacing:.16em;fill:#8A8A86}
  .acc{fill:#C6FF3D}
  .blink{animation:b 1.1s steps(1) infinite}
  @keyframes b{50%{fill-opacity:0}}
  .flow{stroke-dasharray:6 8;animation:f 1.2s linear infinite}
  @keyframes f{to{stroke-dashoffset:-28}}
</style>
<g clip-path="url(#card)">
  <rect width="600" height="372" fill="#0B0B0C"/><rect width="600" height="372" fill="url(#dots)"/><rect width="600" height="372" fill="url(#glow)"/>
  <text x="32" y="44" class="mono label">05  /  AGENTIC RAG</text>
  <text x="568" y="47" text-anchor="end" class="sans" font-size="22" fill="#F4F4F0" fill-opacity=".55">↗</text>
  <rect x="32" y="120" width="84" height="34" rx="9" fill="#131315" stroke="#fff" stroke-opacity="0.2"/><text x="74.0" y="142" text-anchor="middle" class="mono" font-size="13" fill="#F4F4F0">rewrite</text><path d="M122 137 H134" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/><path d="M130 133 l5 4 l-5 4" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/><rect x="140" y="120" width="132" height="34" rx="9" fill="#131315" stroke="#fff" stroke-opacity="0.2"/><text x="206.0" y="142" text-anchor="middle" class="mono" font-size="13" fill="#F4F4F0">hybrid search</text><path d="M278 137 H290" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/><path d="M286 133 l5 4 l-5 4" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/><rect x="296" y="120" width="68" height="34" rx="9" fill="#131315" stroke="#fff" stroke-opacity="0.2"/><text x="330.0" y="142" text-anchor="middle" class="mono" font-size="13" fill="#F4F4F0">grade</text><path d="M370 137 H382" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/><path d="M378 133 l5 4 l-5 4" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/><rect x="388" y="120" width="76" height="34" rx="9" fill="#C6FF3D" stroke="#fff" stroke-opacity="0"/><text x="426.0" y="142" text-anchor="middle" class="mono" font-size="13" fill="#0B0B0C">answer</text>
  <path d="M327 118 C327 74 70 74 70 114" fill="none" stroke="#C6FF3D" stroke-width="1.5" class="flow"/>
  <path d="M65 108 l5 7 l5 -7" fill="none" stroke="#C6FF3D" stroke-width="1.5"/>
  <text x="198" y="78" text-anchor="middle" class="mono acc" font-size="12">weak? rewrite &amp; retry</text>
  <text x="32" y="192" class="mono" font-size="13" fill="#8A8A86"><tspan class="acc">[1]</tspan> monsoon_report.pdf · p.12  <tspan class="acc">✓ verified</tspan></text>
  <text x="32" y="250" class="sans" font-size="36" font-weight="700" letter-spacing="-.02em" fill="#F4F4F0">RagGPT</text>
  <text class="sans" font-size="18" fill="#A3A39E"><tspan x="32" y="281">Self-correcting RAG over your PDFs that</tspan><tspan x="32" y="305">grades retrieval and verifies citations.</tspan></text>
  <rect x="32" y="322" width="74" height="28" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/><text x="69.0" y="341" text-anchor="middle" class="mono" font-size="13" fill="#C9C9C4">Python</text><rect x="114" y="322" width="58" height="28" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/><text x="143.0" y="341" text-anchor="middle" class="mono" font-size="13" fill="#C9C9C4">BM25</text><rect x="180" y="322" width="82" height="28" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/><text x="221.0" y="341" text-anchor="middle" class="mono" font-size="13" fill="#C9C9C4">Vectors</text>
</g>
<rect x=".5" y=".5" width="599" height="371" rx="19.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
</svg>
