<svg xmlns="http://www.w3.org/2000/svg" width="600" height="372" viewBox="0 0 600 372" role="img" aria-label="Pencyl Studio: Notebook-style document design with a local illustration engine.">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".06"/></pattern>
  <radialGradient id="glow" cx="88%" cy="0%" r="75%"><stop offset="0" stop-color="#C6FF3D" stop-opacity=".14"/><stop offset="1" stop-color="#C6FF3D" stop-opacity="0"/></radialGradient>
  <clipPath id="card"><rect width="600" height="372" rx="20"/></clipPath>
</defs>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
  .label{font-size:13px;letter-spacing:.16em;fill:#8A8A86}
  .acc{fill:#C6FF3D}
  .blink{animation:b 1.1s steps(1) infinite}
  @keyframes b{50%{fill-opacity:0}}
  .flow{stroke-dasharray:6 8;animation:f 1.2s linear infinite}
  @keyframes f{to{stroke-dashoffset:-28}}
</style>
<g clip-path="url(#card)">
  <rect width="600" height="372" fill="#0B0B0C"/><rect width="600" height="372" fill="url(#dots)"/><rect width="600" height="372" fill="url(#glow)"/>
  <text x="32" y="44" class="mono label">06  /  DOC STUDIO</text>
  <text x="568" y="47" text-anchor="end" class="sans" font-size="22" fill="#F4F4F0" fill-opacity=".55">↗</text>
  <g transform="rotate(-3 228 136)">
    <rect x="60" y="70" width="336" height="132" rx="6" fill="#F4F1E8"/>
    <line x1="60" y1="104" x2="396" y2="104" stroke="#7FA2D6" stroke-opacity=".55"/><line x1="60" y1="122" x2="396" y2="122" stroke="#7FA2D6" stroke-opacity=".55"/><line x1="60" y1="140" x2="396" y2="140" stroke="#7FA2D6" stroke-opacity=".55"/><line x1="60" y1="158" x2="396" y2="158" stroke="#7FA2D6" stroke-opacity=".55"/><line x1="60" y1="176" x2="396" y2="176" stroke="#7FA2D6" stroke-opacity=".55"/><line x1="60" y1="194" x2="396" y2="194" stroke="#7FA2D6" stroke-opacity=".55"/>
    <line x1="96" y1="70" x2="96" y2="202" stroke="#FF6A6A" stroke-opacity=".7"/>
    <rect x="108" y="84" width="150" height="16" rx="3" fill="#F7FF5C" fill-opacity=".8"/>
    <text x="110" y="98" font-family="'Bradley Hand','Segoe Print','Comic Sans MS',cursive" font-size="21" font-weight="700" fill="#1E1E1E">Photosynthesis</text>
    <text x="110" y="134" font-family="'Bradley Hand','Segoe Print','Comic Sans MS',cursive" font-size="15" fill="#333">light + CO₂ + H₂O → glucose</text>
    <path d="M110 166 q14 -12 28 0 t28 0 t28 0" fill="none" stroke="#2f6fe0" stroke-width="2"/>
    <circle cx="232" cy="164" r="12" fill="none" stroke="#FF6A3D" stroke-width="2"/>
  </g>
  <g transform="translate(470 140) rotate(-32)">
    <rect x="-70" y="-9" width="120" height="18" fill="#C6FF3D"/>
    <rect x="-70" y="-9" width="120" height="6" fill="#fff" fill-opacity=".25"/>
    <rect x="-92" y="-9" width="22" height="18" rx="3" fill="#FF8FA3"/>
    <rect x="-74" y="-9" width="8" height="18" fill="#BDBDBD"/>
    <path d="M50 -9 L76 0 L50 9 Z" fill="#E9CFA0"/>
    <path d="M68 -3 L76 0 L68 3 Z" fill="#2B2B2B"/>
  </g>
  <text x="32" y="250" class="sans" font-size="36" font-weight="700" letter-spacing="-.02em" fill="#F4F4F0">Pencyl Studio</text>
  <text class="sans" font-size="18" fill="#A3A39E"><tspan x="32" y="281">Notebook-style document design with a</tspan><tspan x="32" y="305">local illustration engine.</tspan></text>
  <rect x="32" y="322" width="106" height="28" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/><text x="85.0" y="341" text-anchor="middle" class="mono" font-size="13" fill="#C9C9C4">JavaScript</text><rect x="146" y="322" width="58" height="28" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/><text x="175.0" y="341" text-anchor="middle" class="mono" font-size="13" fill="#C9C9C4">Node</text>
</g>
<rect x=".5" y=".5" width="599" height="371" rx="19.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
</svg>
