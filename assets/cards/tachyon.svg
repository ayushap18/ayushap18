<svg xmlns="http://www.w3.org/2000/svg" width="600" height="372" viewBox="0 0 600 372" role="img" aria-label="Tachyon: AI-native terminal. Plain-English commands, an agent that asks before every step.">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".06"/></pattern>
  <radialGradient id="glow" cx="88%" cy="0%" r="75%"><stop offset="0" stop-color="#C6FF3D" stop-opacity=".14"/><stop offset="1" stop-color="#C6FF3D" stop-opacity="0"/></radialGradient>
  <clipPath id="card"><rect width="600" height="372" rx="20"/></clipPath>
</defs>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
  .label{font-size:13px;letter-spacing:.16em;fill:#8A8A86}
  .acc{fill:#C6FF3D}
  .blink{animation:b 1.1s steps(1) infinite}
  @keyframes b{50%{fill-opacity:0}}
  .flow{stroke-dasharray:6 8;animation:f 1.2s linear infinite}
  @keyframes f{to{stroke-dashoffset:-28}}
</style>
<g clip-path="url(#card)">
  <rect width="600" height="372" fill="#0B0B0C"/><rect width="600" height="372" fill="url(#dots)"/><rect width="600" height="372" fill="url(#glow)"/>
  <text x="32" y="44" class="mono label">01  /  TERMINAL</text>
  <text x="568" y="47" text-anchor="end" class="sans" font-size="22" fill="#F4F4F0" fill-opacity=".55">↗</text>
  <rect x="32" y="68" width="536" height="138" rx="12" fill="#131315" stroke="#fff" stroke-opacity=".1"/>
  <circle cx="52" cy="88" r="5" fill="#fff" fill-opacity=".18"/><circle cx="68" cy="88" r="5" fill="#fff" fill-opacity=".18"/><circle cx="84" cy="88" r="5" fill="#fff" fill-opacity=".18"/>
  <text x="300" y="92" text-anchor="middle" class="mono" font-size="12" fill="#8A8A86">tachyon — zsh</text>
  <line x1="32" y1="104" x2="568" y2="104" stroke="#fff" stroke-opacity=".08"/>
  <text x="52" y="132" class="mono" font-size="15" fill="#F4F4F0"><tspan class="acc">ai ›</tspan> free up space in downloads</text>
  <text x="52" y="158" class="mono" font-size="15" fill="#8A8A86">  du -sh ~/Downloads/* | sort -h | tail</text>
  <rect x="52" y="172" width="78" height="24" rx="6" fill="#C6FF3D"/><text x="91" y="189" text-anchor="middle" class="mono" font-size="12" fill="#0B0B0C">⏎ run</text>
  <rect x="138" y="172" width="78" height="24" rx="6" fill="none" stroke="#fff" stroke-opacity=".2"/><text x="177" y="189" text-anchor="middle" class="mono" font-size="12" fill="#C9C9C4">e edit</text>
  <rect x="224" y="172" width="98" height="24" rx="6" fill="none" stroke="#fff" stroke-opacity=".2"/><text x="273" y="189" text-anchor="middle" class="mono" font-size="12" fill="#C9C9C4">? explain</text>
  <rect x="334" y="176" width="9" height="16" class="acc blink"/>
  <text x="32" y="250" class="sans" font-size="36" font-weight="700" letter-spacing="-.02em" fill="#F4F4F0">Tachyon</text>
  <text class="sans" font-size="18" fill="#A3A39E"><tspan x="32" y="281">AI-native terminal. Plain-English commands,</tspan><tspan x="32" y="305">an agent that asks before every step.</tspan></text>
  <rect x="32" y="322" width="58" height="28" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/><text x="61.0" y="341" text-anchor="middle" class="mono" font-size="13" fill="#C9C9C4">Rust</text><rect x="98" y="322" width="66" height="28" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/><text x="131.0" y="341" text-anchor="middle" class="mono" font-size="13" fill="#C9C9C4">Tauri</text><rect x="172" y="322" width="74" height="28" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/><text x="209.0" y="341" text-anchor="middle" class="mono" font-size="13" fill="#C9C9C4">Dioxus</text>
</g>
<rect x=".5" y=".5" width="599" height="371" rx="19.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
</svg>
